name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build & Verify (xwork + xtask)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (1.94.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Rust build cache (kache)
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v2.0.0
        with:
          version: "2.0.0"
          cache-executables: "false"
          github-cache: "true"
          manifest-key: ci-check
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run xwork CI DAG
        run: cargo xwork

      - name: Run graph-audit break-check
        run: cargo xtask graph-audit --break-check

      - name: Run DBR pipeline break-check
        run: cargo xtask check --break-check --enforce-dbr

      - name: Smoke check CLI
        run: cargo run --package idp-cli -j 2 -- bot list

  xtask-ci:
    name: xtask-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup installs the rust-toolchain.toml pin (rustfmt and clippy included).
      - name: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: Rust build cache (kache)
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v2.0.0
        with:
          version: "2.0.0"
          cache-executables: "false"
          github-cache: "true"
          manifest-key: xtask-ci
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo xtask ci
        run: cargo xtask ci
