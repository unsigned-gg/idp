# cargo-deny policy for kl
[graph]
all-features = true
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
ignore = [
  # unsafe-libyaml (via serde_yaml) is unmaintained, not vulnerable. unsigned-gg/ls ignores the
  # same advisory (ff916bd). Drop this when serde_yaml is replaced.
  "RUSTSEC-2024-0449",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
