name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build & Verify (xwork + xtask)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (1.88.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Run xwork CI DAG
        run: cargo xwork

      - name: Run graph-audit break-check
        run: cargo xtask graph-audit --break-check

      - name: Run DBR pipeline break-check
        run: cargo xtask check --break-check --enforce-dbr

      - name: Smoke check CLI
        run: cargo run --package idp-cli -j 2 -- bot list
